const lg=document.getElementById('legend');

  // perpendicular offsets in half-steps, Euclidean spacing; labeled items go last among equal values so their label has room
  const placed=[]; let maxK=0;
  items.map((p,i)=>({i,a:coord(p),l:p.label?1:0})).sort((u,v)=>u.a-v.a||u.l-v.l).forEach(o=>{
    let k=0; while(placed.some(q=>Math.hypot((q.k-k)*perp,q.a-o.a)<pitch-.5)) k+=.5;
    placed.push({...o,k}); maxK=Math.max(maxK,k);
  });
  const ks=[]; placed.forEach(o=>ks[o.i]=o.k); return {ks,n:maxK+1};
}

const svg=document.getElementById('chart'), tip=document.getElementById('tip'), card=svg.parentElement;
const X0=20,X1=25000, Y0=7/1024, Y1=12000;
const xt=[{v:20,l:'20 MHz'},{v:100,l:'100 MHz'},{v:1000,l:'1 GHz'},{v:10000,l:'10 GHz'}];
const yt=[16/1024,128/1024,1,8,64,512,4096].map(v=>({v,l:fmtMem(v)}));

let MARKS=[];
function mark(parent,p,x,y,S){
  const c=CAT[p.cat]; MARKS.push({x,y,r:S/2+2.5,p});
  const g=el('g',{class:'pt','data-cat':p.cat,tabindex:'0',transform:`translate(${x} ${y})`},parent);
  g.setAttribute('aria-label',`${p.sku}: RAM ${p.ram}; CPU ${p.cpu}`);
  el('circle',{r:Math.max(12,S/2+3),fill:'transparent'},g);
  const d=el('circle',{class:'disc',r:S/2+1.5,fill:'var(--surface)',stroke:`var(${c.col})`,'stroke-width':1.5},g);
  if(p.unconf) d.setAttribute('stroke-dasharray','2.6 2');
  const ic=el('g',{transform:`translate(${-S*0.32} ${-S*0.32}) scale(${S*0.64/16})`,style:`fill:var(${c.col})`},g);
  ic.innerHTML=ICON[p.sub];
  const show=()=>{g.classList.add('hot');showTip(p,g)}, hide=()=>{g.classList.remove('hot');tip.hidden=true};
  g.addEventListener('pointerenter',show);g.addEventListener('pointerleave',hide);
  g.addEventListener('focus',show);g.addEventListener('blur',hide);g.addEventListener('click',show);
}

function draw(){
  svg.textContent=''; MARKS=[];
  const V=view(), pts=V.pts, ramOnly=V.ram, cpuOnly=V.cpu;
  const W=Math.max(300,svg.clientWidth||card.clientWidth-16), narrow=W<560;
  const S=narrow?12:18, pitch=S+5, gap=8;
  const H=narrow?Math.round(W*1.7):Math.round(Math.min(780,Math.max(660,W*0.72)));
  const m={l:narrow?46:60,r:12,t:30,b:40};
  const L=Math.log10;
  // solve layout: box sizes depend on scales and vice versa; two passes converge
  const labPad=0, cpuStep=(narrow||MODE==='all')?pitch:Math.round(pitch*1.7);
  let ramBoxW=pitch+8, cpuBoxH=pitch+8, sy, sx, rs, cs, iw, ih, px0, py1;
  for(let pass=0;pass<3;pass++){
    px0=m.l+ramBoxW+gap; iw=W-px0-m.r;
    ih=H-m.t-gap-cpuBoxH-m.b; py1=m.t+ih;
    sy=v=>m.t+ih-(L(v)-L(Y0))/(L(Y1)-L(Y0))*ih;
    sx=v=>px0+(L(v)-L(X0))/(L(X1)-L(X0))*iw;
    rs=swarm(ramOnly,p=>sy(p.mb),pitch); cs=swarm(cpuOnly,p=>sx(p.mhz),pitch,cpuStep);
    ramBoxW=rs.n*pitch+8+labPad; cpuBoxH=cs.n*cpuStep+8;
  }
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('height',H);
  const rbx=m.l, cby=py1+gap;

  // zones in plot
  el('rect',{x:px0,y:sy(5),width:iw,height:py1-sy(5),fill:'var(--band2)'},svg);
  el('rect',{x:px0,y:m.t,width:iw,height:sy(48)-m.t,fill:'var(--band)'},svg);
  txt(svg,{x:px0+iw-8,y:sy(48)-8,'text-anchor':'end',class:'zone'},iw<640?'External DRAM':'External DRAM · application processors');
  txt(svg,{x:px0+iw-8,y:sy(5)+16,'text-anchor':'end',class:'zone'},iw<640?'On-chip SRAM':'On-chip SRAM · microcontrollers');

  // side boxes
  el('rect',{x:rbx,y:m.t,width:ramBoxW,height:ih,rx:6,fill:'var(--boxfill)',stroke:'var(--axis)','stroke-dasharray':'3 3'},svg);
  el('rect',{x:px0,y:cby,width:iw,height:cpuBoxH,rx:6,fill:'var(--boxfill)',stroke:'var(--axis)','stroke-dasharray':'3 3'},svg);
  txt(svg,{x:rbx,y:m.t-10,class:'boxlab'},`RAM only · ${ramOnly.length}`);
  const cl=txt(svg,{x:px0-gap,y:cby+cpuBoxH/2-2,'text-anchor':'end',class:'boxlab'},'Clock');
  txt(svg,{x:px0-gap,y:cby+cpuBoxH/2+11,'text-anchor':'end',class:'boxlab'},`only · ${cpuOnly.length}`);

  // grid + ticks (span boxes so box values read off the same scale)
  (narrow?xt.slice(1):xt).forEach(t=>{const x=sx(t.v);el('line',{x1:x,x2:x,y1:m.t,y2:cby+cpuBoxH,stroke:'var(--grid)'},svg);
    txt(svg,{x,y:cby+cpuBoxH+15,'text-anchor':'middle',class:'tick'},t.l)});
  yt.forEach(t=>{const y=sy(t.v);el('line',{x1:rbx,x2:px0+iw,y1:y,y2:y,stroke:'var(--grid)'},svg);
    txt(svg,{x:rbx-6,y:y+4,'text-anchor':'end',class:'tick'},t.l)});
  el('line',{x1:px0,x2:px0+iw,y1:py1,y2:py1,stroke:'var(--axis)'},svg);
  el('line',{x1:px0,x2:px0,y1:m.t,y2:py1,stroke:'var(--axis)'},svg);
  txt(svg,narrow?{x:W-m.r,y:H-6,'text-anchor':'end',class:'axlab'}:{x:px0+iw/2,y:H-6,'text-anchor':'middle',class:'axlab'},narrow?'CPU (cores × clock) →':'Aggregate CPU clock (cores × clock) →');
  txt(svg,{transform:`translate(12 ${m.t+ih/2}) rotate(-90)`,'text-anchor':'middle',class:'axlab'},'RAM →');

  // side-box marks
  ramOnly.forEach((p,i)=>mark(svg,p,rbx+4+pitch/2+rs.ks[i]*pitch,sy(p.mb),S));
  cpuOnly.forEach((p,i)=>mark(svg,p,sx(p.mhz),cby+4+pitch/2+cs.ks[i]*cpuStep,S));

  // main plot: relax overlapping markers apart, each held near its true position
  const pos=pts.map((p,i)=>{const a=(i*2.399963)%(2*Math.PI);return [sx(p.mhz)+Math.cos(a)*.5,sy(p.mb)+Math.sin(a)*.5]});
  const home=pts.map(p=>[sx(p.mhz),sy(p.mb)]), minD=S+4;
  for(let it=0;it<240;it++){
    for(let i=0;i<pos.length;i++)for(let j=i+1;j<pos.length;j++){
      const dx=pos[j][0]-pos[i][0], dy=pos[j][1]-pos[i][1], d=Math.hypot(dx,dy)||.01;
      if(d<minD){const f=(minD-d)/2/d;pos[i][0]-=dx*f;pos[i][1]-=dy*f;pos[j][0]+=dx*f;pos[j][1]+=dy*f}
    }
    pos.forEach((q,i)=>{q[0]+=(home[i][0]-q[0])*.04;q[1]+=(home[i][1]-q[1])*.04;
      q[0]=Math.min(px0+iw-S/2-2,Math.max(px0+S/2+2,q[0]));q[1]=Math.min(py1-S/2-2,Math.max(m.t+S/2+2,q[1]))});
  }
  // tick at each true position, joined to its marker when displaced
  pts.forEach((p,i)=>{const [hx,hy]=home[i],[x,y]=pos[i];
    if(Math.hypot(x-hx,y-hy)>S/2) el('line',{x1:hx,y1:hy,x2:x,y2:y,stroke:`var(${CAT[p.cat].col})`,'stroke-width':1,opacity:.55},svg);
    el('circle',{cx:hx,cy:hy,r:1.6,fill:`var(${CAT[p.cat].col})`},svg)});
  pts.map((p,i)=>i).sort((a,b)=>pts[b].mhz-pts[a].mhz).forEach(i=>mark(svg,pts[i],pos[i][0],pos[i][1],S));
  placeLabels(W,H,narrow);
  applyFilter();
}

// ---- labels: greedy placement around each labeled marker, avoiding marks, text and other labels
function placeLabels(W,H,narrow){
  const fs=narrow?9.5:11;
  const obst=[];
  const rectOf=b=>({x0:b.x-1,y0:b.y-1,x1:b.x+b.width+1,y1:b.y+b.height+1});
  svg.querySelectorAll('text').forEach(tn=>{try{obst.push(rectOf(tn.getBBox()))}catch(e){}});
  MARKS.forEach(m=>obst.push({x0:m.x-m.r,y0:m.y-m.r,x1:m.x+m.r,y1:m.y+m.r}));
  const hit=(a,b)=>a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;
  const layer=el('g',{class:'labels'},svg), lines=el('g',{},layer), texts=el('g',{},layer);
  const todo=MODE==='named'?MARKS.filter(m=>m.p.named):[];
  todo.forEach(m=>m.dens=MARKS.filter(o=>Math.hypot(o.x-m.x,o.y-m.y)<60).length);
  todo.sort((a,b)=>b.dens-a.dens);
  const angles=[0,180,-30,30,150,-150,-60,60,-120,120,-90,90].map(a=>a*Math.PI/180);
  todo.forEach(m=>{
    const p=m.p, tn=el('text',{class:'dlab','font-size':fs},texts);
    const t1=el('tspan',{},tn); t1.textContent=p.named;
    const t2=el('tspan',{class:'dsub','font-size':fs-1.5},tn);
    t2.textContent=`${p.mb==null?'RAM ?':fmtMem(p.mb)} · ${p.mhz==null?'clock ?':fmtHz(p.mhz)}`;
    const tw=Math.max(t1.getComputedTextLength(),t2.getComputedTextLength()), th=fs*2+2;
    let best=null;
    outer: for(const rad of [m.r+4,m.r+14,m.r+26,44,62,84,110,140,175]){
      for(const a of angles){
        const px=m.x+Math.cos(a)*rad, py=m.y+Math.sin(a)*rad, c=Math.cos(a);
        const x0=c>0.3?px:c<-0.3?px-tw:px-tw/2;
        const y0=Math.sin(a)>0.5?py:Math.sin(a)<-0.5?py-th:py-th/2;
        const r={x0:x0-2,y0:y0-1,x1:x0+tw+2,y1:y0+th+1};
        if(r.x0<2||r.x1>W-2||r.y0<2||r.y1>H-2) continue;
        if(obst.some(o=>hit(o,r))) continue;
        best={r,x0,y0,rad};break outer;
      }
    }
    if(!best){tn.remove();return}
    obst.push(best.r);
    t1.setAttribute('x',best.x0); t1.setAttribute('y',best.y0+fs-1); t2.setAttribute('x',best.x0); t2.setAttribute('y',best.y0+fs*2);
    tn.setAttribute('data-cat',m.p.cat);
    if(best.rad>m.r+4){
      // leader from marker edge to nearest point of the label box
      const qx=Math.max(best.r.x0,Math.min(m.x,best.r.x1)), qy=Math.max(best.r.y0,Math.min(m.y,best.r.y1));
      const d=Math.hypot(qx-m.x,qy-m.y)||1;
      el('line',{x1:m.x+(qx-m.x)/d*m.r,y1:m.y+(qy-m.y)/d*m.r,x2:qx,y2:qy,stroke:'var(--ink-2)','stroke-width':.8,opacity:.7},lines);
    }
  });
}
function showTip(p,g){
  tip.textContent='';
  const add=(cls,s,par=tip)=>{const d=document.createElement('div');d.className=cls;d.textContent=s;par.appendChild(d);return d};
  add('t1',p.sku); add('t2',p.vendor+' · '+CAT[p.cat].name);
  const rows=[['RAM',p.mb==null?clip('Unknown: '+p.ram,90):p.ram],['CPU',p.mhz==null?clip('Unknown: '+p.cpu,90):p.cpu]];
  if(p.mhz!=null) rows.push(['Aggregate',fmtHz(p.mhz)]);
  if(p.unconf) rows.push(['Note','Value not confirmed for this device']);
  rows.push(['Confidence',p.conf]);
  rows.forEach(([k,v])=>{const r=add('row','');add('k',k,r);add('v',v,r)});
  tip.hidden=false;
  const gb=g.getBoundingClientRect(), cb=card.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  const x=gb.left+gb.width/2-cb.left, y=gb.top+gb.height/2-cb.top;
  let left=x+16; if(left+tw>cb.width-4) left=x-tw-16; left=Math.max(4,left);
  let top=y-th/2; top=Math.max(4,Math.min(top,cb.height-th-4));
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(draw,80)}).observe(card);

// notes
const notes=document.getElementById('notes');
function renderNotes(){
  notes.textContent='';
  const neither=DATA.total-ALL.length;
  const list = MODE==='all' ? [
   [`${DATA.total} devices in the dataset.`,` ${pts.length} have both figures and sit in the chart. ${ramOnly.length} have RAM but no clock speed (left box); ${cpuOnly.length} have a clock speed but no RAM size (bottom box). The other ${neither} have neither, or have conflicting or unconfirmed values for both.`],
   ['Dashed rings',' mark a value the dataset gives conditionally: inferred, reported but unverified, or tied to an unconfirmed chip.'],
   ['Overlaps.',' Overlapping icons are pushed apart; a small dot marks each device’s true position, with a line to its icon when it moved. In the boxes, devices with the same value sit side by side.'],
   ['Judgment calls.',' Archer BE550 uses its v1 hardware (4× A73 @ 2.2 GHz); Apple TV 4K (3rd gen) uses EveryMac’s 5-core ~2.9 GHz estimate; Amazon Smart Thermostat uses its main MCU’s 128 KB, excluding the ESP32 Wi-Fi chip; the LG range counts its 4 MB pSRAM. Rows with a range or conflict on one figure (Tapo C200 RAM, Hue Bridge v2 RAM, Home Assistant Yellow RAM, Apple Watch SE 3 RAM) are treated as unknown on that figure.']
  ] : [
   [`${nNamed} familiar devices`,` from the full set of ${nAll}, chosen to span the categories. Each is a mass-market model from one of the top-ranked vendors in its category. Devices in the boxes have only one of the two figures.`],
   ['Same scales',' as the full chart, so positions compare directly.']
  ];
  list.forEach(([b,tx])=>{const p=document.createElement('p');const s=document.createElement('b');s.textContent=b;p.appendChild(s);p.appendChild(document.createTextNode(tx));notes.appendChild(p)});
}

// table
document.getElementById('tcount').textContent=ALL.length;
const tb=document.querySelector('#tbl tbody');
const ord=k=>CATS.findIndex(c=>c.k===k);
[...ALL].sort((a,b)=>ord(a.cat)-ord(b.cat)||(b.mb??-1)-(a.mb??-1)||(b.mhz??0)-(a.mhz??0)).forEach(p=>{
  const tr=document.createElement('tr');
  [CAT[p.cat].name,p.vendor+' '+p.sku,p.where,p.mhz==null?'—':p.cpu,p.mb==null?'—':p.ram,p.mhz==null?'—':fmtHz(p.mhz),p.conf].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===5)td.className='num';tr.appendChild(td)});
  tb.appendChild(tr);
});
setMode(MODE);
</script>
